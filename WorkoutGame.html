<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Joint-Safe Fitness Quest</title>

  <!-- OPTION B: Emoji App Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">

  <!-- Mobile web app meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout Quest" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-checkbox:checked {
      background-color: #10b981;
      border-color: #10b981;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 font-sans antialiased select-none">

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- Top Navigation -->
    <div class="flex items-center justify-between mb-3">
      <a href="index.html" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-400 hover:text-emerald-400 transition-colors">
        &larr; Back to App Creations
      </a>
      <button onclick="toggleCalendar()" class="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-2.5 py-1 rounded-lg flex items-center gap-1">
        📅 <span id="calendar-toggle-text">View Calendar</span>
      </button>
    </div>

    <!-- Header & Character Status -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-4 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <div>
          <span id="rank-title" class="text-xs font-bold uppercase tracking-wider text-emerald-400">Spine Initiate</span>
          <h1 class="text-2xl font-black text-white flex items-center gap-2">
            Level <span id="level-display">1</span>
          </h1>
        </div>
        <div class="text-right">
          <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Quest Streak</span>
          <div class="text-xl font-black text-amber-300 flex items-center justify-end gap-1">
            🔥 <span id="streak-display">0</span> <span class="text-sm font-normal text-slate-400">days</span>
          </div>
        </div>
      </div>

      <!-- XP Progress Bar -->
      <div class="w-full bg-slate-800 h-3.5 rounded-full overflow-hidden mb-2 border border-slate-700/50">
        <div id="xp-bar" class="bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-400 h-full w-0 transition-all duration-300"></div>
      </div>
      <div class="flex justify-between text-xs text-slate-400">
        <span>Total XP: <strong id="current-xp" class="text-slate-200">0</strong></span>
        <span>Next Level: <strong id="next-level-xp" class="text-slate-200">100</strong> XP</span>
      </div>
    </header>

    <!-- CALENDAR DRAWER (Collapsible) -->
    <section id="calendar-drawer" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-5 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <button onclick="changeMonth(-1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold">&larr; Prev</button>
        <h3 id="calendar-month-year" class="text-sm font-bold text-white">Month 2026</h3>
        <button onclick="changeMonth(1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold">Next &rarr;</button>
      </div>

      <!-- Calendar Grid Headers -->
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-500 mb-1">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>

      <!-- Calendar Days Grid -->
      <div id="calendar-days" class="grid grid-cols-7 gap-1 text-xs"></div>

      <!-- Legend -->
      <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-around text-[10px] text-slate-400">
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Completed</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full border border-cyan-400"></span> Today</span>
      </div>
    </section>

    <!-- 7-DAY WEEK SELECTOR -->
    <nav class="grid grid-cols-7 gap-1 bg-slate-900 p-1.5 rounded-xl mb-4 border border-slate-800 text-[11px] font-bold text-center">
      <button onclick="switchDay('mon')" id="tab-mon" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Mon</span><span class="text-[9px] opacity-70 font-normal">Rest</span>
      </button>
      <button onclick="switchDay('tue')" id="tab-tue" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Tue</span><span class="text-[9px] opacity-70 font-normal">Hike</span>
      </button>
      <button onclick="switchDay('wed')" id="tab-wed" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Wed</span><span class="text-[9px] opacity-70 font-normal">Push</span>
      </button>
      <button onclick="switchDay('thu')" id="tab-thu" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Thu</span><span class="text-[9px] opacity-70 font-normal">Rest</span>
      </button>
      <button onclick="switchDay('fri')" id="tab-fri" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Fri</span><span class="text-[9px] opacity-70 font-normal">Legs</span>
      </button>
      <button onclick="switchDay('sat')" id="tab-sat" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Sat</span><span class="text-[9px] opacity-70 font-normal">Rest</span>
      </button>
      <button onclick="switchDay('sun')" id="tab-sun" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Sun</span><span class="text-[9px] opacity-70 font-normal">Pull</span>
      </button>
    </nav>

    <!-- Active Day Banner & Quest Title -->
    <section class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 mb-4">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span id="day-badge" class="px-2 py-0.5 text-[10px] font-black uppercase rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            Wednesday
          </span>
          <span id="today-indicator" class="hidden px-2 py-0.5 text-[10px] font-black uppercase rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 animate-pulse">
            Today
          </span>
        </div>
        <button onclick="resetDayChecklist()" class="text-xs text-slate-500 hover:text-rose-400 underline transition">
          Reset Tasks
        </button>
      </div>
      <h2 id="quest-title" class="text-lg font-bold text-white">Workout Title</h2>
      <p id="quest-desc" class="text-xs text-slate-400 mt-0.5">Joint-safe & spine-spared routine</p>
    </section>

    <!-- Checklist Container -->
    <section id="checklist-container" class="space-y-3 mb-6"></section>

    <!-- Complete Workout Button -->
    <button id="complete-btn" onclick="completeWorkout()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-bold rounded-xl shadow-lg transition duration-150 flex items-center justify-center gap-2">
      <span id="complete-btn-text">Complete Daily Quest (+50 Bonus XP)</span>
    </button>

  </main>

  <!-- JavaScript Logic -->
  <script>
    // --- RANK TITLES FOR LEVELING UP ---
    const rankTitles = {
      1: "Spine Initiate",
      2: "Core Defender",
      3: "Joint Guardian",
      4: "Mobility Vanguard",
      5: "Resilience Master"
    };

    const daysMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const fullDayNames = {
      mon: "Monday",
      tue: "Tuesday",
      wed: "Wednesday",
      thu: "Thursday",
      fri: "Friday",
      sat: "Saturday",
      sun: "Sunday"
    };

    // --- SCHEDULED ROUTINES BY DAY ---
    const weeklySchedule = {
      mon: {
        title: "Active Recovery & Decompression",
        desc: "Spine decompression and light mobility to prepare for the week.",
        xpPerTask: 10,
        bonusXp: 30,
        tasks: [
          { name: "5-Min Gentle Sciatic Nerve Flossing", cue: "Seated nerve glides, smooth and pain-free" },
          { name: "Light 15-Min Walk or Gentle Mobility", cue: "Increases circulation without joint friction" },
          { name: "Hydration & Anti-Inflammatory Check", cue: "Supports connective tissue recovery" }
        ]
      },
      tue: {
        title: "Nature Trail Cardio Hike",
        desc: "Low-impact zone 2 cardio on packed-dirt trails.",
        xpPerTask: 20,
        bonusXp: 50,
        tasks: [
          { name: "5-Min Nerve Floss & Mobility Warm-Up", cue: "Preps L5-S1 nerve root before walking" },
          { name: "Nature Trail Hike (45–60 min)", cue: "Soft dirt path, shorter strides, glute drive" },
          { name: "Post-Hike Calf & Quad Gentle Stretch", cue: "Avoid bending forward at waist" }
        ]
      },
      wed: {
        title: "Gym: Push & Core Stability",
        desc: "Chest support to eliminate lumbar shear force.",
        xpPerTask: 15,
        bonusXp: 50,
        tasks: [
          { name: "Warm-Up: Cat-Cow, Nerve Floss, Bird-Dogs", cue: "Mid-back mobility and core bracing" },
          { name: "Seated Chest Press Machine (3 × 10–12)", cue: "Back fully supported against backrest" },
          { name: "30° Incline DB Bench Press (3 × 10–12)", cue: "Ribcage pinned; no lumbar hyperextension" },
          { name: "Seated DB Lateral Raises (3 × 12–15)", cue: "Sitting removes lower-back sway" },
          { name: "Cable Rope Triceps Pushdowns (3 × 12–15)", cue: "Smooth constant tension on elbow joints" },
          { name: "Dead Bugs or Bird-Dogs (3 × 8/side)", cue: "Anti-extension deep abdominal brace" }
        ]
      },
      thu: {
        title: "Mid-Week Joint Rest & Mobility",
        desc: "Allow arthritis inflammation to settle between lifting days.",
        xpPerTask: 10,
        bonusXp: 30,
        tasks: [
          { name: "Cat-Cow & Supine Glute Bridges (2 sets)", cue: "Gentle pelvic alignment and blood flow" },
          { name: "15-Min Casual Stroll / Low-Impact Step Goal", cue: "Keep joints lubricated with synovial fluid" },
          { name: "Gentle Hip Flexor Opening", cue: "Half-kneeling with upright spine" }
        ]
      },
      fri: {
        title: "Gym: Spine-Spared Lower Body",
        desc: "Strengthen legs and glutes with zero spinal compression.",
        xpPerTask: 15,
        bonusXp: 50,
        tasks: [
          { name: "Warm-Up: Nerve Floss & Glute Bridges", cue: "Wake up gluteus medius/maximus" },
          { name: "Leg Press - High & Wide Feet (3 × 10–12)", cue: "Keep pelvis down; do not round tailbone" },
          { name: "Seated or Lying Hamstring Curls (3 × 12–15)", cue: "Stabilizes knee and posterior pelvic tilt" },
          { name: "Dumbbell Romanian Deadlifts (3 × 8–10)", cue: "Pure hip hinge; lower DBs to shin level only" },
          { name: "Cable / Band Glute Kickbacks (3 × 12–15/leg)", cue: "Squeeze top; no lower back arching" },
          { name: "Banded Walks / Clamshells (2 × 15/side)", cue: "Strengthens SI joint stabilizers" }
        ]
      },
      sat: {
        title: "Weekend Rest & Decompression",
        desc: "Rest day to recharge ahead of Sunday's pull workout.",
        xpPerTask: 10,
        bonusXp: 30,
        tasks: [
          { name: "5-Min Nerve Floss & Deep Belly Breathing", cue: "Relaxes pelvic floor and lumbar muscles" },
          { name: "Outdoor Fresh Air / Gentle Mobility", cue: "Promotes parasympathetic recovery" }
        ]
      },
      sun: {
        title: "Gym: Pull & Posterior Chain",
        desc: "Upper back strength, posture, and grip.",
        xpPerTask: 15,
        bonusXp: 50,
        tasks: [
          { name: "Warm-Up: Cat-Cow & Torso Rotations", cue: "Gentle mid-spine lubrication" },
          { name: "Chest-Supported Row (3 × 10–12)", cue: "Pad supports torso completely" },
          { name: "Lat Pulldowns - Neutral/Wide Grip (3 × 10–12)", cue: "Pull down to collarbone; stay upright" },
          { name: "Cable Face Pulls (3 × 15)", cue: "Eye-level cable; targets rotator cuff" },
          { name: "Seated Incline Dumbbell Curls (3 × 12)", cue: "Spine fully rested against pad" },
          { name: "Farmer's Walks (3 × 35 paces)", cue: "Tall posture, strong abdominal brace" }
        ]
      }
    };

    // --- STATE MANAGEMENT ---
    let currentSelectedDay = 'wed';
    let calendarDate = new Date();
    let state = JSON.parse(localStorage.getItem('jointSafeQuestState')) || {
      xp: 0,
      level: 1,
      streak: 0,
      lastCompletedDate: null,
      history: {},
      checks: {}
    };

    function saveState() {
      localStorage.setItem('jointSafeQuestState', JSON.stringify(state));
      renderHeader();
      renderCalendar();
    }

    // --- DAY SWITCHING & UI ---
    function switchDay(dayKey) {
      currentSelectedDay = dayKey;
      const todayIndex = new Date().getDay();
      const todayKey = daysMap[todayIndex];

      ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(d => {
        const tabBtn = document.getElementById(`tab-${d}`);
        if (d === dayKey) {
          tabBtn.className = "py-2 rounded-lg bg-emerald-600 text-white font-bold shadow flex flex-col items-center";
        } else {
          tabBtn.className = "py-2 rounded-lg text-slate-400 hover:text-slate-200 font-semibold flex flex-col items-center";
        }
      });

      const dayData = weeklySchedule[dayKey];
      document.getElementById('day-badge').innerText = fullDayNames[dayKey];
      document.getElementById('quest-title').innerText = dayData.title;
      document.getElementById('quest-desc').innerText = dayData.desc;

      const todayIndicator = document.getElementById('today-indicator');
      if (dayKey === todayKey) {
        todayIndicator.classList.remove('hidden');
      } else {
        todayIndicator.classList.add('hidden');
      }

      document.getElementById('complete-btn-text').innerText = `Complete ${fullDayNames[dayKey]} Quest (+${dayData.bonusXp} XP)`;

      renderChecklist();
    }

    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = '';
      const dayData = weeklySchedule[currentSelectedDay];

      dayData.tasks.forEach((task, index) => {
        const taskId = `${currentSelectedDay}_task_${index}`;
        const isChecked = !!state.checks[taskId];

        const card = document.createElement('div');
        card.className = `flex items-start gap-3 p-3.5 rounded-xl border transition-all ${
          isChecked ? 'bg-slate-900/40 border-emerald-500/30' : 'bg-slate-900 border-slate-800'
        }`;

        card.innerHTML = `
          <input type="checkbox" id="${taskId}" ${isChecked ? 'checked' : ''} 
            onchange="toggleTask('${taskId}', ${dayData.xpPerTask})"
            class="custom-checkbox mt-1 w-5 h-5 rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-0 cursor-pointer" />
          <label for="${taskId}" class="flex-1 cursor-pointer">
            <div class="font-medium text-sm text-slate-100 ${isChecked ? 'line-through text-slate-400' : ''}">
              ${task.name}
            </div>
            <div class="text-xs text-slate-400 mt-0.5">${task.cue}</div>
          </label>
        `;
        container.appendChild(card);
      });
    }

    function renderHeader() {
      const xpPerLevel = 100;
      const calculatedLevel = Math.floor(state.xp / xpPerLevel) + 1;
      state.level = calculatedLevel;

      const xpForNextLevel = state.level * xpPerLevel;
      const currentLevelBaseXP = (state.level - 1) * xpPerLevel;
      const progressXP = state.xp - currentLevelBaseXP;
      const percent = Math.min(Math.max((progressXP / xpPerLevel) * 100, 0), 100);

      document.getElementById('level-display').innerText = state.level;
      document.getElementById('streak-display').innerText = state.streak;
      document.getElementById('current-xp').innerText = state.xp;
      document.getElementById('next-level-xp').innerText = xpForNextLevel;
      document.getElementById('xp-bar').style.width = `${percent}%`;

      const rankKey = Math.min(state.level, 5);
      document.getElementById('rank-title').innerText = rankTitles[rankKey] || "Resilience Legend";
    }

    // --- GAMEPLAY MECHANICS ---
    function toggleTask(taskId, xpVal) {
      const isChecked = document.getElementById(taskId).checked;
      if (isChecked) {
        state.checks[taskId] = true;
        addXP(xpVal);
      } else {
        delete state.checks[taskId];
        addXP(-xpVal);
      }
      saveState();
      renderChecklist();
    }

    function addXP(amount) {
      const oldLevel = Math.floor(state.xp / 100) + 1;
      state.xp = Math.max(0, state.xp + amount);
      const newLevel = Math.floor(state.xp / 100) + 1;

      if (newLevel > oldLevel) {
        const newTitle = rankTitles[Math.min(newLevel, 5)] || "Resilience Legend";
        alert(`🎉 LEVEL UP! You reached Level ${newLevel}!\nNew Title: [${newTitle}]\nJoint & spine resilience +10!`);
      }
      saveState();
    }

    function completeWorkout() {
      const dayData = weeklySchedule[currentSelectedDay];
      const allChecked = dayData.tasks.every((_, idx) => state.checks[`${currentSelectedDay}_task_${idx}`]);

      if (!allChecked) {
        alert("Please check off all exercises in today's quest before completing!");
        return;
      }

      const now = new Date();
      const dateKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      
      if (!state.history) state.history = {};
      if (!state.history[dateKey]) state.history[dateKey] = [];

      if (!state.history[dateKey].includes(dayData.title)) {
        state.history[dateKey].push(dayData.title);
        
        const todayStr = now.toDateString();
        if (state.lastCompletedDate !== todayStr) {
          state.streak += 1;
          state.lastCompletedDate = todayStr;
        }
      }

      addXP(dayData.bonusXp);
      saveState();
      alert(`⚔️ ${fullDayNames[currentSelectedDay]} Quest Completed!\n+${dayData.bonusXp} Bonus XP awarded.\nSaved to your Quest Calendar!`);
    }

    function resetDayChecklist() {
      if (confirm(`Reset checklist for ${fullDayNames[currentSelectedDay]}?`)) {
        weeklySchedule[currentSelectedDay].tasks.forEach((_, idx) => {
          delete state.checks[`${currentSelectedDay}_task_${idx}`];
        });
        saveState();
        renderChecklist();
      }
    }

    // --- CALENDAR LOGIC ---
    function toggleCalendar() {
      const drawer = document.getElementById('calendar-drawer');
      const text = document.getElementById('calendar-toggle-text');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        text.innerText = "Hide Calendar";
        renderCalendar();
      } else {
        drawer.classList.add('hidden');
        text.innerText = "View Calendar";
      }
    }

    function changeMonth(direction) {
      calendarDate.setMonth(calendarDate.getMonth() + direction);
      renderCalendar();
    }

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const container = document.getElementById('calendar-days');
      container.innerHTML = '';

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-9 rounded-lg bg-slate-900/30";
        container.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasCompleted = state.history && state.history[dateKey] && state.history[dateKey].length > 0;
        const isToday = isCurrentMonth && today.getDate() === day;

        const cell = document.createElement('div');
        cell.className = `h-9 flex flex-col items-center justify-center rounded-lg border text-xs font-semibold transition-all relative ${
          hasCompleted 
            ? 'bg-emerald-950/70 border-emerald-500/80 text-emerald-300 shadow-sm' 
            : 'bg-slate-800/60 border-slate-700/50 text-slate-400'
        } ${isToday ? 'border-cyan-400 ring-1 ring-cyan-400/40 text-cyan-200' : ''}`;

        cell.innerHTML = `
          <span>${day}</span>
          ${hasCompleted ? `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mt-0.5"></span>` : ''}
        `;

        if (hasCompleted) {
          cell.title = `Completed: ${state.history[dateKey].join(', ')}`;
        }

        container.appendChild(cell);
      }
    }

    // --- INITIALIZE TO TODAY'S DAY OF THE WEEK ---
    const currentDayOfWeek = daysMap[new Date().getDay()];
    switchDay(currentDayOfWeek);
    renderHeader();
  </script>
</body>
</html>
