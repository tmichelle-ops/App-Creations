<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hyrule Fitness Quest | Sheikah Slate</title>

  <!-- Added ?v=2 to break Safari's cache -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
<link rel="icon" type="image/png" sizes="180x180" href="./apple-touch-icon.png?v=2" />
  
  <!-- Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sheikah Slate" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
    
    body {
      font-family: 'Rajdhani', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .zelda-title {
      font-family: 'Cinzel', serif;
    }

    /* Sheikah Slate Glowing Borders & HUD */
    .sheikah-card {
      background: radial-gradient(circle at 50% 0%, #0d1b2a 0%, #050b14 100%);
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
    }

    .sheikah-active-tab {
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.25) 0%, rgba(0, 240, 255, 0.05) 100%);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .custom-checkbox:checked {
      background-color: #00f0ff;
      border-color: #00f0ff;
      box-shadow: 0 0 8px #00f0ff;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 selection:bg-cyan-500 selection:text-black">

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- Top Sheikah Bar -->
    <div class="flex items-center justify-between mb-3 text-xs">
      <a href="index.html" class="inline-flex items-center gap-1.5 font-bold text-cyan-400 hover:text-cyan-300 transition-colors uppercase tracking-widest">
        <span>&larr;</span> Citadel Portal
      </a>
      <button onclick="toggleCalendar()" class="font-bold text-amber-400 bg-amber-950/40 border border-amber-500/50 px-3 py-1 rounded flex items-center gap-1.5 shadow-[0_0_8px_rgba(234,179,8,0.2)] tracking-wider">
        <span>📜</span> <span id="calendar-toggle-text">Quest Log</span>
      </button>
    </div>

    <!-- Breath of the Wild Hero HUD Card -->
    <header class="sheikah-card rounded-2xl p-5 mb-4 relative overflow-hidden">
      <!-- Ancient Sheikah Background Sigil -->
      <div class="absolute -right-8 -bottom-8 text-8xl text-cyan-500/5 pointer-events-none select-none font-serif">
        👁️
      </div>

      <div class="flex items-start justify-between mb-3">
        <div>
          <div class="flex items-center gap-1.5 text-[10px] font-black uppercase tracking-widest text-cyan-400">
            <span>▲</span>
            <span id="rank-title" class="zelda-title">Hylian Traveler</span>
          </div>
          <h1 class="text-3xl font-black text-white flex items-center gap-2 mt-0.5 tracking-wide">
            Rank <span id="level-display" class="text-cyan-300">1</span>
          </h1>
        </div>
        
        <!-- Rupees & Streak -->
        <div class="text-right flex flex-col items-end">
          <div class="flex items-center gap-1.5 text-sm font-black text-emerald-300 bg-emerald-950/70 px-2.5 py-0.5 rounded border border-emerald-500/50 mb-1 shadow-[0_0_8px_rgba(16,185,129,0.2)]">
            <span>💎</span> <span id="rupee-display">0</span> <span class="text-[10px] uppercase font-bold text-emerald-400">Rupees</span>
          </div>
          <div class="text-xs font-bold text-amber-300 flex items-center gap-1">
            🔥 <span id="streak-display">0</span> Day Streak
          </div>
        </div>
      </div>

      <!-- Hearts HUD (Increases with level) -->
      <div class="flex items-center gap-1 mb-3 text-base text-rose-500 drop-shadow-[0_0_6px_rgba(244,63,94,0.6)]" id="hearts-container">
        <span>❤️</span><span>❤️</span><span>❤️</span>
      </div>

      <!-- Stamina Wheel Spirit Orb Progress Bar -->
      <div class="w-full bg-slate-900/90 h-3 rounded-full overflow-hidden mb-1.5 border border-cyan-500/40 p-[1px]">
        <div id="xp-bar" class="bg-gradient-to-r from-teal-400 via-cyan-400 to-emerald-400 h-full w-0 transition-all duration-300 rounded-full shadow-[0_0_8px_rgba(0,240,255,0.7)]"></div>
      </div>
      <div class="flex justify-between text-[11px] font-bold text-slate-400 tracking-wider">
        <span>Spirit XP: <strong id="current-xp" class="text-cyan-300">0</strong></span>
        <span>Next Milestone: <strong id="next-level-xp" class="text-slate-200">600</strong> XP</span>
      </div>
    </header>

    <!-- SHEIKAH SLATE QUEST LOG (Collapsible Calendar) -->
    <section id="calendar-drawer" class="hidden bg-slate-900/95 border-2 border-cyan-500/60 rounded-2xl p-4 mb-4 shadow-[0_0_15px_rgba(0,240,255,0.2)]">
      <div class="flex items-center justify-between mb-3 border-b border-cyan-800/40 pb-2">
        <button onclick="changeMonth(-1)" class="px-2.5 py-1 rounded bg-slate-800 border border-cyan-800 text-cyan-300 text-xs font-bold hover:bg-slate-700">&larr;</button>
        <div class="text-center">
          <div class="text-[9px] uppercase tracking-widest text-cyan-400 font-bold">Sheikah Slate Records</div>
          <h3 id="calendar-month-year" class="text-sm font-black text-white">Month 2026</h3>
        </div>
        <button onclick="changeMonth(1)" class="px-2.5 py-1 rounded bg-slate-800 border border-cyan-800 text-cyan-300 text-xs font-bold hover:bg-slate-700">&rarr;</button>
      </div>

      <!-- Calendar Grid Headers -->
      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-black text-cyan-400/80 mb-1">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>

      <!-- Calendar Days Grid -->
      <div id="calendar-days" class="grid grid-cols-7 gap-1 text-xs"></div>

      <!-- Legend -->
      <div class="mt-3 pt-2.5 border-t border-cyan-900/50 flex items-center justify-around text-[10px] text-slate-300 font-medium">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_4px_#00f0ff]"></span> Cleared</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full border border-amber-400 bg-amber-950"></span> Today</span>
      </div>
    </section>

    <!-- 7-DAY HYRULE MAP NAVIGATION -->
    <nav class="grid grid-cols-7 gap-1 bg-slate-900/90 p-1.5 rounded-xl mb-4 border border-cyan-900/40 text-[11px] font-bold text-center">
      <button onclick="switchDay('mon')" id="tab-mon" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Mon</span><span class="text-[9px] opacity-70 font-normal">VR</span>
      </button>
      <button onclick="switchDay('tue')" id="tab-tue" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Tue</span><span class="text-[9px] opacity-70 font-normal">Hike</span>
      </button>
      <button onclick="switchDay('wed')" id="tab-wed" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Wed</span><span class="text-[9px] opacity-70 font-normal">Push</span>
      </button>
      <button onclick="switchDay('thu')" id="tab-thu" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Thu</span><span class="text-[9px] opacity-70 font-normal">Play</span>
      </button>
      <button onclick="switchDay('fri')" id="tab-fri" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Fri</span><span class="text-[9px] opacity-70 font-normal">Legs</span>
      </button>
      <button onclick="switchDay('sat')" id="tab-sat" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Sat</span><span class="text-[9px] opacity-70 font-normal">Rest</span>
      </button>
      <button onclick="switchDay('sun')" id="tab-sun" class="py-2 rounded-lg transition-all flex flex-col items-center">
        <span>Sun</span><span class="text-[9px] opacity-70 font-normal">Pull</span>
      </button>
    </nav>

    <!-- Active Quest Header Banner -->
    <section class="bg-gradient-to-b from-slate-900 to-slate-950 border border-cyan-500/30 rounded-2xl p-4 mb-4 shadow-sm relative">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span id="day-badge" class="px-2.5 py-0.5 text-[10px] font-black uppercase rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 tracking-wider">
            Wednesday Shrine
          </span>
          <span id="today-indicator" class="hidden px-2 py-0.5 text-[10px] font-black uppercase rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 animate-pulse">
            Active Now
          </span>
        </div>
        <button onclick="resetDayChecklist()" class="text-[11px] text-cyan-400/60 hover:text-rose-400 underline transition">
          Reset Trials
        </button>
      </div>
      <h2 id="quest-title" class="text-lg font-black text-white tracking-wide">Daily Quest Title</h2>
      <p id="quest-desc" class="text-xs text-slate-400 mt-0.5">Spine-spared trial guidelines</p>
    </section>

    <!-- Checklist Container -->
    <section id="checklist-container" class="space-y-3 mb-6"></section>

    <!-- Complete Workout Button -->
    <button id="complete-btn" onclick="completeWorkout()" class="w-full py-4 bg-gradient-to-r from-cyan-600 via-teal-500 to-cyan-600 hover:from-cyan-500 hover:to-teal-400 active:scale-[0.98] text-slate-950 font-black tracking-wider uppercase rounded-xl shadow-[0_0_15px_rgba(0,240,255,0.4)] transition duration-150 flex items-center justify-center gap-2">
      <span id="complete-btn-text">Clear Daily Shrine (+50 Spirit XP)</span>
    </button>

  </main>

  <!-- JavaScript Logic -->
  <script>
    // --- 6-MONTH PROGRESSIVE XP CURVE & BOTW TITLES ---
    const rankTitles = {
      1: "Hylian Traveler",
      2: "Kokiri Scout",
      3: "Goron Pillar",
      4: "Zora Champion",
      5: "Sheikah Guardian",
      6: "Knight of the Realm",
      7: "Master of the Wild",
      8: "Hero of Hyrule"
    };

    const levelThresholds = [0, 0, 600, 1800, 3600, 6000, 9000, 12500, 16500];

    function calculateLevelData(xp) {
      let level = 1;
      for (let i = 1; i < levelThresholds.length; i++) {
        if (xp >= levelThresholds[i]) {
          level = i;
        } else {
          break;
        }
      }

      const currentFloor = levelThresholds[level];
      const nextCeiling = levelThresholds[level + 1] || currentFloor + 4000;
      const xpIntoCurrentLevel = xp - currentFloor;
      const xpNeededForLevel = nextCeiling - currentFloor;
      const progressPercent = Math.min(Math.max((xpIntoCurrentLevel / xpNeededForLevel) * 100, 0), 100);

      return {
        level,
        nextCeiling,
        progressPercent
      };
    }

    const daysMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const fullDayNames = {
      mon: "Monday",
      tue: "Tuesday",
      wed: "Wednesday",
      thu: "Thursday",
      fri: "Friday",
      sat: "Saturday",
      sun: "Sunday"
    };

    // --- 100% SPINE-SAFE ALL-MACHINE SCHEDULE ---
    const weeklySchedule = {
      mon: {
        title: "Trial of the Virtual Arena (Home VR)",
        desc: "High-energy VR boxing or cardio studio shrine (FitXR / Les Mills).",
        xpPerTask: 15,
        bonusXp: 40,
        bonusRupees: 30,
        tasks: [
          { name: "5-Min Nerve Floss & Sheikah Mobility", cue: "Glides sciatic nerve and warms mid-back before combat" },
          { name: "25–30 Min VR Boxing Studio Trial", cue: "Pivot on balls of feet; maintain upright torso; avoid jarring spinal twists" },
          { name: "Decompression: Arm, Shoulder & Calf Relief", cue: "Gentle upright stretching, deep diaphragmatic breathing" }
        ]
      },
      tue: {
        title: "Expedition to Hyrule Ridge (Cardio Hike)",
        desc: "Scenic trail hike; low-impact aerobic endurance on nature dirt paths.",
        xpPerTask: 20,
        bonusXp: 50,
        bonusRupees: 50,
        tasks: [
          { name: "5-Min Nerve Floss & Pelvic Alignment", cue: "Preps L5-S1 nerve root before hitting dirt trails" },
          { name: "Scenic Nature Trail Hike (45–60 min)", cue: "Soft dirt path, shorter strides, powerful glute push-off" },
          { name: "Post-Hike Calf & Quad Gentle Stretch", cue: "Keep spine tall; avoid rounding lower back" }
        ]
      },
      wed: {
        title: "Goron Forge: Shield & Push (All-Machine)",
        desc: "Chest, shoulders & triceps with full backrest support.",
        xpPerTask: 15,
        bonusXp: 50,
        bonusRupees: 40,
        tasks: [
          { name: "Shrine Warm-Up: Cat-Cow & Torso Mobility", cue: "Lubricates mid-back without lumbar hyperextension" },
          { name: "Seated Chest Press Machine (3 × 10–12)", cue: "Back fully flat against backrest; adjust handles to mid-chest" },
          { name: "Incline Chest Press Machine (3 × 10–12)", cue: "Back supported; use foot assist pedal to protect shoulders" },
          { name: "Machine Lateral Raise (Deltoid) (3 × 12–15)", cue: "Padded arm rests guide movement; eliminates neck shrugging" },
          { name: "Cable Rope Triceps Pushdowns (3 × 12–15)", cue: "Pin elbows to sides; smooth constant tension on tendons" },
          { name: "Seated Cable Pallof Press (3 × 10/side)", cue: "Sit upright against backrest; press cable out to lock core" }
        ]
      },
      thu: {
        title: "Korok Forest Sanctuary (Active Play & Recovery)",
        desc: "Muscle repair, joint relief, gentle mobility or light Nex Playground.",
        xpPerTask: 10,
        bonusXp: 30,
        bonusRupees: 25,
        tasks: [
          { name: "Seated Sciatic Nerve Flossing & Cat-Cow", cue: "Relieves joint stiffness without spinal compression" },
          { name: "Nex Playground Active Session (or Gentle Walk)", cue: "Light, low-impact interactive play to keep joints lubricated" },
          { name: "Recovery Elixir: Hydration & Connective Stretch", cue: "Eases arthritis inflammation and restores elasticity" }
        ]
      },
      fri: {
        title: "Zora Waterfall: Pillar & Leg (All-Machine)",
        desc: "Lower-body power for quads, hamstrings & glutes with zero spinal loading.",
        xpPerTask: 15,
        bonusXp: 50,
        bonusRupees: 40,
        tasks: [
          { name: "Warm-Up: Nerve Floss & Seated Leg Swings", cue: "Activates glute stabilizers and hip lubricators" },
          { name: "Leg Press - High & Wide Feet (3 × 10–12)", cue: "Keep tailbone glued down; never round lower back" },
          { name: "Seated or Lying Hamstring Curls (3 × 12–15)", cue: "Align knees with pivot point; stabilizes posterior pelvis" },
          { name: "Glute Kickback Machine (3 × 12–15/leg)", cue: "Padded chest rest locks spine; squeeze glute at peak" },
          { name: "Seated Hip Abductor Machine (3 × 15)", cue: "Push outward against pads; strengthens SI-joint stabilizers" },
          { name: "Leg Press Calf Extensions (3 × 15)", cue: "Drive through balls of feet; controlled ankle strength" }
        ]
      },
      sat: {
        title: "Rest at the Lakeside Stable",
        desc: "Full rest and recovery to prepare for Sunday's pull quest.",
        xpPerTask: 10,
        bonusXp: 30,
        bonusRupees: 20,
        tasks: [
          { name: "5-Min Nerve Floss & Deep Belly Breathing", cue: "Calms nervous system and relaxes lumbar stabilizers" },
          { name: "Gentle Casual Movement / Hyrule Stroll", cue: "Promotes parasympathetic recovery" }
        ]
      },
      sun: {
        title: "Citadel Armory: Pull & Posterior (All-Machine)",
        desc: "Back, rear shoulders, and biceps with torso-supported machine stabilization.",
        xpPerTask: 15,
        bonusXp: 50,
        bonusRupees: 40,
        tasks: [
          { name: "Warm-Up: Seated Sciatic Floss & Shoulder Circles", cue: "Upper spine and nerve lubrication" },
          { name: "Seated Chest-Supported Row Machine (3 × 10–12)", cue: "Chest pad absorbs torso weight; zero lumbar strain" },
          { name: "Lat Pulldowns - Neutral/Wide Grip (3 × 10–12)", cue: "Pull down to collarbone; keep spine tall and upright" },
          { name: "Cable Face Pulls (3 × 15)", cue: "Cable set at eye level; strengthens upper back & rotator cuff" },
          { name: "Preacher Curl Machine (or Cable Curls) (3 × 12)", cue: "Fixed pivot arm eliminates body swing or back arching" },
          { name: "Seated Cable High-to-Low Woodchopper (3 × 10/side)", cue: "Anti-rotation rotational core brace with upright spine" }
        ]
      }
    };

    // --- STATE MANAGEMENT ---
    let currentSelectedDay = 'wed';
    let calendarDate = new Date();
    let state = JSON.parse(localStorage.getItem('hyruleQuestState')) || {
      xp: 0,
      level: 1,
      streak: 0,
      rupees: 0,
      hearts: 3,
      lastCompletedDate: null,
      history: {},
      checks: {}
    };

    function saveState() {
      localStorage.setItem('hyruleQuestState', JSON.stringify(state));
      renderHeader();
      renderCalendar();
    }

    // --- DAY SWITCHING & UI ---
    function switchDay(dayKey) {
      currentSelectedDay = dayKey;
      const todayIndex = new Date().getDay();
      const todayKey = daysMap[todayIndex];

      ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(d => {
        const tabBtn = document.getElementById(`tab-${d}`);
        if (d === dayKey) {
          tabBtn.className = "py-2 rounded-lg sheikah-active-tab font-black flex flex-col items-center";
        } else {
          tabBtn.className = "py-2 rounded-lg text-slate-400 hover:text-cyan-200 font-semibold flex flex-col items-center";
        }
      });

      const dayData = weeklySchedule[dayKey];
      document.getElementById('day-badge').innerText = `${fullDayNames[dayKey]} Trial`;
      document.getElementById('quest-title').innerText = dayData.title;
      document.getElementById('quest-desc').innerText = dayData.desc;

      const todayIndicator = document.getElementById('today-indicator');
      if (dayKey === todayKey) {
        todayIndicator.classList.remove('hidden');
      } else {
        todayIndicator.classList.add('hidden');
      }

      document.getElementById('complete-btn-text').innerText = `Clear ${fullDayNames[dayKey]} Shrine (+${dayData.bonusXp} Spirit XP)`;

      renderChecklist();
    }

    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = '';
      const dayData = weeklySchedule[currentSelectedDay];

      dayData.tasks.forEach((task, index) => {
        const taskId = `${currentSelectedDay}_task_${index}`;
        const isChecked = !!state.checks[taskId];

        const card = document.createElement('div');
        card.className = `flex items-start gap-3 p-3.5 rounded-xl border transition-all ${
          isChecked 
            ? 'bg-cyan-950/20 border-cyan-500/40 shadow-[0_0_8px_rgba(0,240,255,0.15)]' 
            : 'bg-slate-900/80 border-slate-800 hover:border-slate-700'
        }`;

        card.innerHTML = `
          <input type="checkbox" id="${taskId}" ${isChecked ? 'checked' : ''} 
            onchange="toggleTask('${taskId}', ${dayData.xpPerTask})"
            class="custom-checkbox mt-1 w-5 h-5 rounded border-cyan-800 bg-slate-800 text-cyan-500 focus:ring-0 cursor-pointer" />
          <label for="${taskId}" class="flex-1 cursor-pointer">
            <div class="font-bold text-sm ${isChecked ? 'line-through text-cyan-400/50' : 'text-slate-100'}">
              ${task.name}
            </div>
            <div class="text-xs text-slate-400 mt-0.5">${task.cue}</div>
          </label>
        `;
        container.appendChild(card);
      });
    }

    function renderHeader() {
      const data = calculateLevelData(state.xp);
      state.level = data.level;

      document.getElementById('level-display').innerText = state.level;
      document.getElementById('streak-display').innerText = state.streak;
      document.getElementById('rupee-display').innerText = state.rupees || 0;
      document.getElementById('current-xp').innerText = state.xp;
      document.getElementById('next-level-xp').innerText = data.nextCeiling;
      document.getElementById('xp-bar').style.width = `${data.progressPercent}%`;

      // Rank Title
      const rankKey = Math.min(state.level, 8);
      document.getElementById('rank-title').innerText = rankTitles[rankKey] || "Hero of Hyrule";

      // Heart Containers HUD (Gains hearts as you level up)
      const heartCount = Math.min(3 + Math.floor(state.level / 2), 10);
      const heartsContainer = document.getElementById('hearts-container');
      heartsContainer.innerHTML = '❤️'.repeat(heartCount);
    }

    // --- GAMEPLAY MECHANICS ---
    function toggleTask(taskId, xpVal) {
      const isChecked = document.getElementById(taskId).checked;
      if (isChecked) {
        state.checks[taskId] = true;
        addXP(xpVal);
        state.rupees = (state.rupees || 0) + 5;
      } else {
        delete state.checks[taskId];
        addXP(-xpVal);
        state.rupees = Math.max(0, (state.rupees || 0) - 5);
      }
      saveState();
      renderChecklist();
    }

    function addXP(amount) {
      const oldData = calculateLevelData(state.xp);
      state.xp = Math.max(0, state.xp + amount);
      const newData = calculateLevelData(state.xp);

      if (newData.level > oldData.level) {
        const newTitle = rankTitles[Math.min(newData.level, 8)] || "Hero of Hyrule";
        alert(`🗡️ TRIAL MILESTONE CLEARED!\nYou ascended to Rank ${newData.level}: [${newTitle}]!\nHeart Container Acquired! ❤️`);
      }
      saveState();
    }

    function completeWorkout() {
      const dayData = weeklySchedule[currentSelectedDay];
      const allChecked = dayData.tasks.every((_, idx) => state.checks[`${currentSelectedDay}_task_${idx}`]);

      if (!allChecked) {
        alert("Hero, you must clear all trial tasks before claiming this Shrine's Spirit Orb!");
        return;
      }

      const now = new Date();
      const dateKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      
      if (!state.history) state.history = {};
      if (!state.history[dateKey]) state.history[dateKey] = [];

      if (!state.history[dateKey].includes(dayData.title)) {
        state.history[dateKey].push(dayData.title);
        
        const todayStr = now.toDateString();
        if (state.lastCompletedDate !== todayStr) {
          state.streak += 1;
          state.lastCompletedDate = todayStr;
        }
      }

      addXP(dayData.bonusXp);
      state.rupees = (state.rupees || 0) + (dayData.bonusRupees || 30);
      saveState();
      alert(`✨ SHRINE CLEARED!\n+${dayData.bonusXp} Spirit Power awarded.\n+${dayData.bonusRupees} Rupees added to pouch!\nRecorded in your Sheikah Slate.`);
    }

    function resetDayChecklist() {
      if (confirm(`Reset trials for ${fullDayNames[currentSelectedDay]}?`)) {
        weeklySchedule[currentSelectedDay].tasks.forEach((_, idx) => {
          delete state.checks[`${currentSelectedDay}_task_${idx}`];
        });
        saveState();
        renderChecklist();
      }
    }

    // --- SHEIKAH SLATE CALENDAR ---
    function toggleCalendar() {
      const drawer = document.getElementById('calendar-drawer');
      const text = document.getElementById('calendar-toggle-text');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        text.innerText = "Close Slate";
        renderCalendar();
      } else {
        drawer.classList.add('hidden');
        text.innerText = "Quest Log";
      }
    }

    function changeMonth(direction) {
      calendarDate.setMonth(calendarDate.getMonth() + direction);
      renderCalendar();
    }

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const container = document.getElementById('calendar-days');
      container.innerHTML = '';

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-9 rounded-lg bg-slate-900/30";
        container.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasCompleted = state.history && state.history[dateKey] && state.history[dateKey].length > 0;
        const isToday = isCurrentMonth && today.getDate() === day;

        const cell = document.createElement('div');
        cell.className = `h-9 flex flex-col items-center justify-center rounded-lg border text-xs font-bold transition-all relative ${
          hasCompleted 
            ? 'bg-cyan-950/70 border-cyan-400 text-cyan-300 shadow-[0_0_8px_rgba(0,240,255,0.4)]' 
            : 'bg-slate-900/70 border-slate-800 text-slate-400'
        } ${isToday ? 'border-amber-400 ring-1 ring-amber-400/50 text-amber-200' : ''}`;

        cell.innerHTML = `
          <span>${day}</span>
          ${hasCompleted ? `<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_4px_#00f0ff] mt-0.5"></span>` : ''}
        `;

        if (hasCompleted) {
          cell.title = `Cleared: ${state.history[dateKey].join(', ')}`;
        }

        container.appendChild(cell);
      }
    }

    // --- INITIALIZE TO CURRENT DAY OF THE WEEK ---
    const currentDayOfWeek = daysMap[new Date().getDay()];
    switchDay(currentDayOfWeek);
    renderHeader();
  </script>
</body>
</html>
